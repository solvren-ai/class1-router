[project]
name = "slm-local-mac"
version = "0.1.0"
description = "Local Apple Silicon (MLX) train + eval path for the SLM platform"
requires-python = ">=3.11"
dependencies = ["mlx-lm>=0.28"]

[project.optional-dependencies]
# Cloud path (run.py without --local): the backend's SageMaker/Bedrock code.
# Same pins as backend/pyproject.toml.
cloud = ["sagemaker>=2.220,<3", "boto3>=1.34", "pyyaml>=6.0"]
